<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#appBgGrad)"/>

  <!-- Inner Clean White Card -->
  <rect x="56" y="56" width="400" height="400" rx="72" fill="#FFFFFF" filter="url(#softShadow)"/>

  <!-- Top Left Finder Eye -->
  <rect x="112" y="112" width="104" height="104" rx="24" fill="#2563EB"/>
  <rect x="136" y="136" width="56" height="56" rx="12" fill="#FFFFFF"/>
  <rect x="152" y="152" width="24" height="24" rx="6" fill="#2563EB"/>

  <!-- Top Right Finder Eye -->
  <rect x="296" y="112" width="104" height="104" rx="24" fill="#2563EB"/>
  <rect x="320" y="136" width="56" height="56" rx="12" fill="#FFFFFF"/>
  <rect x="336" y="152" width="24" height="24" rx="6" fill="#2563EB"/>

  <!-- Bottom Left Finder Eye -->
  <rect x="112" y="296" width="104" height="104" rx="24" fill="#2563EB"/>
  <rect x="136" y="320" width="56" height="56" rx="12" fill="#FFFFFF"/>
  <rect x="152" y="336" width="24" height="24" rx="6" fill="#2563EB"/>

  <!-- Central & Bottom Data Elements -->
  <rect x="240" y="112" width="32" height="32" rx="8" fill="#3B82F6"/>
  <rect x="240" y="176" width="32" height="40" rx="8" fill="#1D4ED8"/>
  <rect x="112" y="240" width="40" height="32" rx="8" fill="#1D4ED8"/>
  <rect x="176" y="240" width="40" height="32" rx="8" fill="#3B82F6"/>

  <!-- Dynamic Center Block -->
  <rect x="240" y="240" width="32" height="32" rx="8" fill="#2563EB"/>
  
  <rect x="296" y="240" width="48" height="32" rx="8" fill="#3B82F6"/>
  <rect x="368" y="240" width="32" height="32" rx="8" fill="#1D4ED8"/>

  <rect x="240" y="296" width="32" height="48" rx="8" fill="#3B82F6"/>
  <rect x="296" y="296" width="48" height="48" rx="12" fill="#2563EB"/>
  <rect x="368" y="296" width="32" height="104" rx="12" fill="#1D4ED8"/>
  <rect x="240" y="368" width="48" height="32" rx="8" fill="#2563EB"/>
  <rect x="312" y="368" width="32" height="32" rx="8" fill="#3B82F6"/>
</svg>
